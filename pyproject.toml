[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meval"
version = "1.1.0"
description = "MDF Enforced Validator and Loader"
authors = [
  { name = "Qiong Liu", email = "qiong.liu@nih.gov" },
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "bento-mdf==0.13.1",
    "boto3==1.36.11",
    "pandas==2.3.3",
    "neo4j-viz==1.0.0",
    "tabulate==0.9.0",
]

[project.urls]
"Homepage" = "https://github.com/CBIIT/MEVAL"
"Bug Tracker" = "https://github.com/CBIIT/MEVAL/issues"

[tool.setuptools]
packages = ["meval"]
