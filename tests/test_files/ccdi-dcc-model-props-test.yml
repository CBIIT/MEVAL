PropDefinitions:
  crdc_id:
    Desc: The crdc_id is a unique identifier that is generated by CRDC Data Submission Portal.
    Type: string
    Tags:
      Template: 'No'      
    Term:
      - Origin: caDSR
        Code: '14534325'
        Value: CCDI Property Unique Identifier
        Version: "1.00"
    Req: false
    Strict: false
    Private: false
  #id
  guid:
    Desc: A unique sequence of characters used to identify, name, or characterize an attribute shared by all members of a class.
    Term:
      - Origin: caDSR
        Code: '14534325'
        Value: CCDI Property Unique Identifier
        Version: "1.00"
    Type: string
    Req: false
    Key: false
    Private: false
  #consent_group
  consent_group_id:
    Desc: A sequence of characters used to uniquely identify, name, or characterize the presence and nature of a consent group in a study.
    Term:
      - Origin: caDSR
        Code: '16306756'
        Value: Study Consent Group Identifier
        Version: "1.00"
    Type: string
    Req: true
    Private: false 
    Key: true
  #consent_group
  consent_group_name:
    Desc: The words or acronym which describe a set of study participants who have signed the same consent agreement and that will be included in the dbGaP repository.
    Term:
      - Origin: caDSR
        Code: '14534329'
        Value: Research Activity dbGaP Consent Group Text
        Version: "1.00"
    Enum:
      - "GRU"
      - "HMB"
    Req: true
    Strict: false
    Private: false 
  #consent_group
  consent_group_suffix:
    Desc: Suffix applied to DCF indexing file record to note the appropriate participant's consent group. 
    Term:
      - Origin: caDSR
        Code: 'TBD'
        Value: DCF indexing consent group file suffix         
        Version: "1.00"
    Type: string
    Req: true
    Private: false
  #survival
  survival_id:
    Desc: A unique sequence of characters used to identify an attribute shared by all members of a class.
    Term:
      - Origin: caDSR
        Code: '14534325'
        Value: CCDI Property Unique Identifier
        Version: "1.00"
    Type: string
    Req: true
    Private: false
    Key: true
  #survival
  last_known_survival_status:
    Desc: Participant vital status
    Term:
      - Origin: caDSR
        Code: '2847330'
        Value: Participant Vital Status Type
        Version: "1.00"
    Enum:
      - "Alive"
      - "Dead"
      - "Not reported"
      - "Unknown"
      - "Unspecified"
    Req: true
    Strict: true
    Private: false
  #survival
  age_at_last_known_survival_status:
    Desc: The age (in days) of the subject when the vitals measurement was taken.
    Term:
      - Origin: caDSR
        Code: '12306025'
        Value: Subject Age at Vitals Day Count
        Version: "1.00"
    Type: number
    Req: true
    Private: false
  #survival
  first_event:
    Desc: Identify the nature of the event that best characterizes the endpoint of the study.
    Term:
      - Origin: caDSR
        Code: '3070936'
        Value: Study End Point Event Type
        Version: "2.00"
    Enum:
      - "Progression"
      - "Relapse"
      - "Second Malignant Neoplasm"
      - "Death"
      - 'Not Reported'
      - "Not Applicable"
      - "Unknown"
    Req: false
    Strict: false
    Private: false
  #survival
  event_free_survival_status:
    Desc: Identify the nature of the event that best characterizes the endpoint of the study.
    Term:
      - Origin: caDSR
        Code: '3070936'
        Value: Study End Point Event Type
        Version: "2.00"
    Enum:
      - "Censored"
      - "Not Censored"
      - 'Not Reported'
      - "Unknown"
    Req: false
    Strict: false
    Private: false
  #survival
  age_at_event_free_survival_status:
    Desc: Time from diagnosis to first event (or censoring), in days.
    Term:
      - Origin: caDSR
        Code: '3229334'
        Value: Study End Point Event Occurrence Day Count
        Version: "1.10"
    Type: number
    Req: false
    Private: false
  #survival
  follow_up_category:
    Desc: A text term based on grouping information about the health status of an individual after a study has officially closed
    Term:
      - Origin: caDSR
        Code: '14480973'
        Value: Subject Follow-Up Category
        Version: "1.00"
    Enum:
      - "adverse_event"
      - "comorbidity"
      - "risk_factor"
      - "other"
    Req: false
    Strict: false
    Private: false
  follow_up_other:
    Desc: "NCI-GLOSS Definition Monitoring a person's health over time after treatment. This includes keeping track of the health of people who participate in a clinical study or clinical trial for a period of time, both during the study and after the study ends"
    Term: 
      - Origin: caDSR
        Code: '3119787'
        Value: Follow Up
        Version: "1.00"
    Enum:
      - "barretts_esophagus_goblet_cells_present"
      - "bmi"
      - "cause_of_response"
      - "diabetes_treatment_type"
      - "dlco_ref_predictive_percent"
      - "ecog_performance_status"
      - "fev1_fvc_post_bronch_percent"
      - "fev1_fvc_pre_bronch_percent"
      - "fev1_ref_post_bronch_percent"
      - "fev1_ref_pre_bronch_percent"
      - "height"
      - "hepatitis_sustained_virological_response"  
    Req: false
    Strict: false
    Private: false  
  #survival
  adverse_event:
    Desc: Common Terminology Criteria for Adverse Events Version 4.0 Low Level Term Name
    Term:
      - Origin: caDSR
        Code: '3125302'
        Value: adverse event
        Version: "1.10"
    Type:
      value_type: list
      item_type:
        - "Atrial Flutter"
        - "Atrioventricular Block Complete"
        - "Atrioventricular Block First Degree"
        - "Autoimmune Disorder"
        - "Avascular Necrosis"
        - "Azoospermia"
        - "Back Pain"
        - "Bile Duct Stenosis"
        - "Biliary Anastomotic Leak"
        - "Biliary Fistula"
        - "Biliary Tract Infection"
        - "Bladder Anastomotic Leak"
        - "Bladder Infection"
        - "Bladder Perforation"
        - "Bladder Spasm"
        - "Bloating"
        - "Blood and Lymphatic System Disorders - Other"
        - "Blood Antidiuretic Hormone Abnormal"
        - "Blood Bilirubin Increased"
        - "Blood Corticotrophin Decreased"
        - "Blood Gonadotrophin Abnormal"
        - "Blood Prolactin Abnormal"
        - "Blurred Vision"
        - "Body Odor"
    Req: false
    Strict: false
    Private: false
  #survival
  comorbidity:
    Desc: The class or category of the secondary disease(s).
    Term:
      - Origin: caDSR
        Code: '14483678'
        Value: Person Comorbidity Type
        Version: "1.00"
    Type:
      value_type: list
      item_type:
        - "Eczema"
        - "Eczematoid dermatitis"
        - "EEG abnormality"
        - "Elevated coagulation factor V activity"
        - "Embryonal neoplasm"
        - "Embryonal rhabdomyosarcoma"
        - "Emphysema"
        - "Enamel hypoplasia"
        - "Encephalocele"
        - "Encephalopathy"
        - "Enchondroma"
        - "Endocardial fibroelastosis"
        - "Enlarged Eustachian valve"
        - "Enlarged kidney"
        - "Enlarged vestibular aqueduct"
        - "Enterocolitis"
        - "Enuresis nocturna"
    Req: false
    Strict: false
    Private: false          
  #survival
  comorbidity_method_of_diagnosis:
    Desc: The class of clinical or laboratory procedure(s) used to determine the secondary disease diagnosis.
    Term: 
      - Origin: caDSR
        Code: '14483681'
        Value: Comorbidity Disease Diagnosis Method Type
        Version: "1.00"
    Type:
      value_type: list
      item_type:
        - "Biopsy"
        - "Bone Scan"
        - "CSF"
        - "CT"
        - "Cytology"
        - "Imaging"
        - "MRI"
        - "Not Applicable"
        - "Not Reported"
        - "Pathology"
        - "PET"
        - "PET-CT"
        - "PET-MRI"
        - "Physical Examination"
        - "Surgical Resection"
        - "Ultrasound"
        - "Unknown"
        - "X-Ray"
    Req: false
    Strict: false
    Private: false
  #survival
  cause_of_death:
    Desc: A high level grouping of the circumstance or condition of greatest rank or importance that results in the death of a living being.
    Term:
      - Origin: caDSR
        Code: '4783273'
        Value: Primary Cause of Death Reason
        Version: "1.00"
    Enum:
      - "Due to non-study treatment"
      - "Due to other cause"
      - "Due to protocol treatment"
      - "Due to secondary primary cancer"
      - "Due to this disease"
      - "Unknown"
    Req: false
    Strict: true
    Private: false
  #survival
  risk_factor:
    Desc: "The text term used to describe a risk factor the patient had at the time of or prior to their diagnosis."
    Term:
      - Origin: caDSR
        Code: '6142389'
        Value: Risk Factor 
        Version: "2.00"
    Type:
      value_type: list
      item_type:
        - "Alcohol Consumption"
        - "Alcoholic Liver Disease"
        - "Allergy, Animal, NOS"
        - "Allergy, Ant"
        - "Allergy, Bee"
        - "Allergy, Cat"
        - "Allergy, Dairy or Lactose"
        - "Allergy, Dog"
        - "Allergy, Eggs"
        - "Allergy, Food, NOS"
        - "Allergy, Fruit"
        - "Allergy, Meat"
        - "Allergy, Mold or Dust"
        - "Allergy, Nuts"
        - "Allergy, Processed Foods"
        - "Allergy, Seafood"
        - "Allergy, Wasp"
        - "Alpha-1 Antitrypsin Deficiency"
        - "Autoimmune Atrophic Chronic Gastritis"
        - "Barrett's Esophagus"
        - "Beckwith-Wiedemann"
        - "Behcet's Disease"
        - "Cancer"
        - "Cholelithiasis"
        - "Chronic Hepatitis"
        - "Cirrhosis"
        - "Colon Polyps"
        - "Common variable immune deficiency (CVID)"
        - "Denys-Drash Syndrome"
        - "Diabetes, NOS"
        - "Diabetes, Type I"
        - "Diabetes, Type II"
        - "Diet"
        - "Diverticulitis"
        - "Endometriosis"
        - "Endosalpingiosis"
        - "Eczema"
        - "Epstein-Barr Virus"
        - "Familial Adenomatous Polyposis"
        - "Fanconi Anemia"
        - "Fibrosis"
        - "Gastric Polyp(s)"
        - "Gilbert's Syndrome"
        - "Gorlin Syndrome"
        - "Hashimoto's Thyroiditis"
        - "Hay Fever"
        - "Headache"
        - "Helicobacter Pylori-Associated Gastritis"
        - "Hematologic Disorder, NOS"
        - "Hemihypertrophy"
        - "Hemochromatosis"
        - "Hepatic Encephalopathy"
        - "Hepatitis B Infection"
        - "Hepatitis C Infection"
        - "Hepatitis, NOS"
        - "High Grade Dysplasia"
        - "HIV"
        - "Human Papillomavirus Infection"
        - "Hypospadias"
        - "Intestinal Metaplasia"
        - "Iron Overload"
        - "Li-Fraumeni Syndrome"
        - "Low Grade Dysplasia"
        - "Lymphocytic Thyroiditis"
        - "Lynch Syndrome"
        - "Myasthenia Gravis"
        - "Nonalcoholic Fatty Liver Disease"
        - "Nonalcoholic Steatohepatitis"
        - "Obesity"
        - "Oral Contraceptives"
        - "Pancreatitis"
        - "Parasitic Disease of Biliary Tract"
        - "Primary Sclerosing Cholangitis"
        - "Recurrent Pyogenic Cholangitis"
        - "Reflux Disease"
        - "Rheumatoid Arthritis"
        - "Rubinstein-Taybi Syndrome"
        - "Sarcoidosis"
        - "Seizure"
        - "Sensory Changes"
        - "Serous tubal intraepithelial carcinoma (STIC)"
        - "Steatosis"
        - "Tattoo"
        - "Thyroid Nodular Hyperplasia"
        - "Tobacco, NOS"
        - "Tobacco, Smokeless"
        - "Tobacco, Smoking"
        - "Turcot Syndrome"
        - "Undescended Testis"
        - "Vision Changes"
        - "Wagr Syndrome"
        - "Unknown"
        - "Not Reported"
    Req: false
    Strict: false
    Private: false  
  # participant
  participant_id:
    Desc: A sequence of letters, numbers, or characters that uniquely identifies the subject who has taken part in the investigation or research study.    
    Term:
      - Origin: caDSR
        Code: '12220014'
        Value: Subject Alternate Data Origin Identifier
        Version: '1'
    Type: string
    Req: true
    Private: false
    Key: true
  # participant
  race: 
    Desc: The text for reporting information about race based on the Office of Management and Budget (OMB) categories SPD 15 (spd15revision.gov).
    Term:
      - Origin: caDSR
        Code: '2192199'
        Value: Race Category Text
        Version: "1.00"
    Type:
      value_type: list
      item_type:
        - "American Indian or Alaska Native"
        - "Asian"
        - "Black or African American"
        - "Hispanic or Latino"
        - "Middle Eastern or North African"
        - "Native Hawaiian or other Pacific Islander"
        - "Not allowed to collect"
        - "Not Reported"
        - "Unknown"
        - "White"
    Req: true
    Strict: false
    Private: false
  # participant
  sex_at_birth:
    Desc: "A textual description of a person's sex at birth."
    Term:
      - Origin: caDSR
        Code: '7572817'
        Value: Person Sex at Birth Category
        Version: "2.0"
    Enum:
      - "Female"
      - "Intersex"
      - "Male"
      - "Not Reported"
      - "Unknown"
      - "Don't Know"
      - "Decline to answer"
      - "None of These Describe Me"
      - "Prefer Not to Answer"
    Req: true
    Strict: false
    Private: false
  # participant
  occupation:
    Desc: "The text term that describes a person's occupation."
    Term:
      - Origin: caDSR
        Code: '10156751'
        Value: Person Occupation Category
        Version: "1.0"
    Enum:
      - "Manager"
      - "Nurse Practitioner"
      - "Other"
      - "Physician"
      - "Retired"
      - "Not Reported"
      - "Unknown"
      - "Student"
    Req: false
    Strict: false
    Private: false
  # study
  study_id: 
    Desc: A sequence of characters used to identify, name, or characterize a pediatric study.
    Term:
      - Origin: caDSR
        Code: '6380045'
        Value: Study Identifier
        Version: "1.00"
    Type: string
    Req: true
    Private: false
    Key: true
  # study
  dbgap_accession:
    Desc: A stable unique alphanumeric identifier assigned to a study and any objects by the database of Genotypes and Phenotypes (dbGaP). 
    Term:
      - Origin: caDSR
        Code: '11524544'
        Value: Research Activity dbGaP Accession Number Identifier 
        Version: "1.00"
    Type: string
    Req: true
    Private: false
  # study
  study_name:
    Desc: The narrative title used as a textual label for a research data collection.
    Term:
      - Origin: caDSR
        Code: '11459810'
        Value: Study Name Text
        Version: "2.00"
    Type: string
    Req: true
    Private: false
  # study
  study_acronym:
    Desc: The acronym or abbreviated form of the title for a research data collection.
    Term:
      - Origin: caDSR
        Code: '11459812'
        Value: Study Short Name Text
        Version: "2.00"
    Type: string
    Req: true
    Private: false
  # study
  study_description:
    Desc: The long form description of the study.
    Term:
      - Origin: caDSR
        Code: '3444002'
        Value: Study Research Identification Descriptive Text
        Version: "2.00"
    Type: string
    Req: true
    Private: false
  # study
  external_url:
    Desc: The specification of a node (file or directory) in a hierarchical file system where an electronic file is located.
    Term:
      - Origin: caDSR
        Code: '11556141'
        Value: Electronic File Pathname Text
        Version: "2.00"
    Type: string
    Req: false  # 02/22/2022 adeforge, not required?
    Private: false
  # study
  experimental_strategy_and_data_subtype:
    Desc: The type of systematic investigation using controlled observations and measurements to test hypotheses or develop a plan of action based on the facts discovered.
    Term:
      - Origin: caDSR
        Code: '12373576'
        Value: Research Activity Experimental Method Type 
        Version: "2.00"
    Type:
      value_type: list
      item_type:
        - "DNA Sequencing"
        - "Methylation Analysis"
        - "Multigene Expression Assay"
        - "Pathology"
        - "Radiology"
        - "RNA Sequencing" 
    Req: false
    Strict: true
    Private: false  
  #study
  study_phase:
    Desc: The status of the study.
    Term:
      - Origin: caDSR
        Code: '15607838'
        Value: Administrative Activity Study Status
        Version: "1.00"
    Enum:
      - "Active"
      - "Completed"
      - "Provisional"
    Req: true
    Strict: true
    Private: false
  #study
  study_period_start:
    Desc: The year in which the study started.
    Term: 
      - Origin: caDSR
        Code: '15607845'
        Value: Administrative Activity Study Period Start Year Date
        Version: "1.00"
    Type: integer
    Req: false
    Private: false
  #study
  study_period_stop:
    Desc: The year in which the study ended.
    Term: 
      - Origin: caDSR
        Code: '15607913'
        Value: Administrative Activity Study Period End Year Date
        Version: "1.00"
    Type: integer
  study_data_types:
    Desc: The type of study or experimental data generated for testing or research purposes.
    Term:
      - Origin: caDSR
        Code: '12571096'
        Value: Data Collection Scientific Data Type Category
        Version: "1.00"
      - Origin: NCIt
        Code: 'C175886'
        Value: Scientific Data Type
        Version: "1.00"
    Type:
      value_type: list
      item_type:
          - "Genomic"
          - "Imaging"
          - "Pathology"
          - "Proteomic"
          - "Radiology"
    Req: false
    Strict: true
    Private: false
  #study
  promotion_status:
    Desc: "The promotion flag for the entire study."
    Term:
      - Origin: caDSR
        Code: ''
        Value: Promotion Status
        Version: "1.00"
    Type:
      value_type: list
      item_type:
        - "Promote"
        - "Redact"
    Req: true
    Strict: true
    Private: false
