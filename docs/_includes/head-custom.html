<style>
  /* ===== Expandable navigation ===== */
  .site-nav { margin-top: 1.5em; }
  .site-nav details { margin-bottom: .5em; }
  /* nested groups indent under their parent */
  .site-nav details details { margin-left: 1em; }
  .site-nav summary {
    cursor: pointer;
    font-weight: 600;
    padding: 4px 0;
    list-style: none;          /* hide default triangle */
    outline: none;
  }
  .site-nav summary::-webkit-details-marker { display: none; }
  .site-nav summary::before { content: "\25B8"; margin-right: .4em; font-size: .8em; }  /* ▸ collapsed */
  .site-nav details[open] > summary::before { content: "\25BE"; }                        /* ▾ expanded */
  .site-nav ul { list-style: none; margin: .25em 0 .5em 1.2em; padding: 0; }
  .site-nav li { margin: 3px 0; }
  .site-nav a.active { font-weight: 700; text-decoration: underline; }
  /* Prevent long nav labels from forcing horizontal scroll */
  .site-nav summary,
  .site-nav a {
    display: block;
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: normal;
  }

  /* ===== Desktop left-column behavior ===== */
  @media (min-width: 961px) {
    .wrapper header {
      /* narrow the theme's default left/right padding so the column
         (title, buttons, nav, footer) shares one left edge */
      padding-left: 15px;
      padding-right: 15px;
      margin-left: 10px;  /* pull the whole column toward the page edge */
      /* let the column scroll internally instead of overrunning the footer */
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      overflow-x: hidden;
    }
  }

  /* ===== Dark mode ===== */
  body.dark-mode { background: #1a1a1a !important; color: #e0e0e0 !important; }
  body.dark-mode .wrapper header,
  body.dark-mode .wrapper section { background: #1a1a1a !important; }
  body.dark-mode h1,
  body.dark-mode h2,
  body.dark-mode h3,
  body.dark-mode h4,
  body.dark-mode h5,
  body.dark-mode h6 { color: #f0f0f0 !important; }
  body.dark-mode a { color: #6ab0f3 !important; }
  /* inline emphasis the theme colors separately — force readable light text */
  body.dark-mode strong,
  body.dark-mode b,
  body.dark-mode em,
  body.dark-mode i,
  body.dark-mode li,
  body.dark-mode p,
  body.dark-mode td,
  body.dark-mode th,
  body.dark-mode dt,
  body.dark-mode dd,
  body.dark-mode span { color: #e8e8e8 !important; }
  /* keep links their blue even when bold/inside emphasis */
  body.dark-mode a,
  body.dark-mode strong a,
  body.dark-mode a strong,
  body.dark-mode em a,
  body.dark-mode a em { color: #6ab0f3 !important; }
  body.dark-mode .site-nav summary { color: #e0e0e0 !important; }
  body.dark-mode pre,
  body.dark-mode code,
  body.dark-mode .highlight,
  body.dark-mode div.highlight,
  body.dark-mode figure.highlight { background: #2a2a2a !important; color: #e0e0e0 !important; }
  body.dark-mode .highlight,
  body.dark-mode div.highlight,
  body.dark-mode figure.highlight {
    border: 1px solid #3a3a3a !important;
    border-radius: 6px !important;
    overflow: hidden;                /* clip inner pre to the rounded corners */
  }
  /* the inner pre sits inside .highlight, so remove its own border/radius
     to avoid a double outline, but keep its padding */
  body.dark-mode .highlight pre,
  body.dark-mode div.highlight pre,
  body.dark-mode figure.highlight pre {
    border: none !important;
    border-radius: 0 !important;
    margin: 0 !important;
  }
  /* standalone pre (not wrapped in .highlight) still gets its own rounding */
  body.dark-mode pre {
    border: 1px solid #3a3a3a !important;
    border-radius: 6px !important;
    overflow: hidden;
  }
  body.dark-mode blockquote { color: #b0b0b0 !important; border-left-color: #444 !important; }
  body.dark-mode table th,
  body.dark-mode table td { border-color: #444 !important; }
  body.dark-mode hr { background-color: #444 !important; }

  /* In dark mode, lighten the theme's syntax-highlight tokens so
     none render as near-black on the dark code background.
     These sit AFTER the inline-text rule so they win inside code blocks. */
  body.dark-mode pre code,
  body.dark-mode pre code *,
  body.dark-mode code span { color: #e0e0e0 !important; }
  body.dark-mode .highlight .n,   /* names */
  body.dark-mode .highlight .nn,  /* namespace */
  body.dark-mode .highlight .nc,  /* class */
  body.dark-mode .highlight .nf,  /* function */
  body.dark-mode .highlight .nb,  /* builtin */
  body.dark-mode .highlight .p,   /* punctuation */
  body.dark-mode .highlight .o    /* operator */
    { color: #d4d4d4 !important; }
  body.dark-mode .highlight .k,   /* keyword */
  body.dark-mode .highlight .kn,
  body.dark-mode .highlight .kd
    { color: #7fb3ff !important; }
  body.dark-mode .highlight .s,   /* strings */
  body.dark-mode .highlight .s1,
  body.dark-mode .highlight .s2
    { color: #ce9178 !important; }
  body.dark-mode .highlight .mi,  /* numbers */
  body.dark-mode .highlight .mf
    { color: #b5cea8 !important; }
  body.dark-mode .highlight .c,   /* comments */
  body.dark-mode .highlight .c1,
  body.dark-mode .highlight .cm
    { color: #9aa0a6 !important; }

  /* Toggle button — right side, pulled inward toward the middle */
  #dark-toggle {
    position: fixed;
    top: 12px;
    right: 360px;         /* larger offset = further from the right edge, toward center */
    z-index: 1000;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid #999;
    border-radius: 4px;
    background: #fff;
    color: #333;
  }
  body.dark-mode #dark-toggle { background: #2a2a2a; color: #e0e0e0; border-color: #666; }

  /* On narrow screens the layout stacks, so keep the button near the edge */
  @media (max-width: 960px) {
    #dark-toggle { right: 12px; }
  }
</style>

<button id="dark-toggle" onclick="toggleDark()">🌙 Dark</button>
<script>
  function applyDark(on) {
    document.body.classList.toggle('dark-mode', on);
    var btn = document.getElementById('dark-toggle');
    if (btn) btn.textContent = on ? '☀️ Light' : '🌙 Dark';
  }
  function toggleDark() {
    var on = !document.body.classList.contains('dark-mode');
    applyDark(on);
    try { localStorage.setItem('meval-dark', on ? '1' : '0'); } catch (e) {}
  }
  // Restore saved preference on every page load
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('meval-dark'); } catch (e) {}
    if (saved === '1') applyDark(true);
  })();
</script>
